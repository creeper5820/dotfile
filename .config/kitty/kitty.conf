~shell zsh
include current-theme.conf

map ctrl+d launch --location=hsplit
map ctrl+r launch --location=vsplit
map Ctrl+W close_window

map ctrl+r no_op
map ctrl+d no_op

# Fonts
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

symbol_map U+4E00-U+9FFF,U+3400-U+4DBF,U+20000-U+2A6DF,U+2A700-U+2B73F,U+2B740-U+2B81F,U+2B820-U+2CEAF,U+2CEB0-U+2EBEF,U+3000-U+303F,U+31C0-U+31EF,U+FF00-U+FFEF,U+2E80-U+2EFF,U+3001-U+3003,U+3008-U+3011,U+3014-U+301F WenQuanYi Micro Hei

font_size 10.5

background_opacity 0.9

# Animation
cursor_trail 1
cursor_trail_decay 0.1 0.4

cursor_shape block
cursor_shape_unfocused beam
shell_integration  no-cursor

cursor_blink_interval -1

enable_audio_bell no
allow_remote_control yes

window_padding_width 5

wheel_scroll_multiplier 1

# For remote container clicpboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
