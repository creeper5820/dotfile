
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning
debug:disable_logs = false

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto

monitor = DP-1,1920x1080@120,0x0,1
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# monitor = eDP-1,1920x1080@144,1920x0,1.2
monitor = eDP-1, disable
# workspace = 6, monitor:eDP-1
# workspace = 7, monitor:eDP-1
# workspace = 8, monitor:eDP-1
# workspace = 9, monitor:eDP-1
# workspace = 10, monitor:eDP-1

monitor = HDMI-A-1,preferred,1920x-720,2,transform,1
workspace =  6, monitor:HDMI-A-1
workspace =  7, monitor:HDMI-A-1
workspace =  8, monitor:HDMI-A-1
workspace =  9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = LANG="C" rofi -show drun
$setting = systemsettings


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# 佩拉 /home/creeper/pictures/wallpaper/Pela-Honkai-Star-Rail-2560x1440.mp4
# 2233 /home/creeper/pictures/wallpaper/2223 2021B拜年纪.mp4
# exec-once = mpvpaper -vs -o "no-audio loop" DP-1 "/home/creeper/pictures/wallpaper/Pela-Honkai-Star-Rail-2560x1440.mp4"
# exec-once = mpvpaper -vs -o "no-audio loop" eDP-1 "/home/creeper/pictures/wallpaper/2223 2021B拜年纪.mp4"
exec-once = hyprpaper
exec-once = LANG=C waybar

exec-once = nm-applet
exec-once = blueman-applet
exec-once = fcitx5 --replace -d
exec-once = clash-verge

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = mako

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# X-WAYLAND
xwayland {
    force_zero_scaling = true
} 
env = GDK_SCALE,1

# SDG MENU
env = XDG_MENU_PREFIX, arch-

# CURSOR
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1

# NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm

# FCITX5
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XIM,fcitx
env = XIM_PROGRAM,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# PROXY
# env = http_proxy,http://127.0.0.1:7890
# env = https_proxy,http://127.0.0.1:7890
# env = all_proxy,socks5://127.0.0.1:7890

# SCREEN-SHOT
env = HYPRSHOT_DIR,/home/creeper/pictures/screenshots

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.1696
        layerrule = blur,waybar
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to main + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    font_family = "JetBrains Mono", "WenQuanYi Micro Hei"
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$main = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $main, return, exec, $terminal
bind = $main, E, exec, $fileManager
bind = $main, D, exec, $menu
bind = $main, P, exec, $setting
bind = $main, W, killactive,
bind = $main, M, exit,
bind = $main, R, togglesplit
bind = $main, F, togglefloating
bind = $main shift, F, fullscreen
bind = $main, tab, workspace, previous
bind = alt, tab, workspace, previous

# Move focus with main + arrow keys
bind = $main, left, movefocus, l
bind = $main, h, movefocus, l

bind = $main, right, movefocus, r
bind = $main, l, movefocus, r

bind = $main, up, movefocus, u
bind = $main, k, movefocus, u

bind = $main, down, movefocus, d
bind = $main, j, movefocus, d

# Switch workspaces with main + [0-9]
bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9
bind = $main, 0, workspace, 10

# Move active window to a workspace with main + SHIFT + [0-9]
bind = $main SHIFT, 1, movetoworkspace, 1
bind = $main SHIFT, 2, movetoworkspace, 2
bind = $main SHIFT, 3, movetoworkspace, 3
bind = $main SHIFT, 4, movetoworkspace, 4
bind = $main SHIFT, 5, movetoworkspace, 5
bind = $main SHIFT, 6, movetoworkspace, 6
bind = $main SHIFT, 7, movetoworkspace, 7
bind = $main SHIFT, 8, movetoworkspace, 8
bind = $main SHIFT, 9, movetoworkspace, 9
bind = $main SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $main, S, togglespecialworkspace, magic
bind = $main SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with main + scroll
bind = $main, mouse_down, workspace, e+1
bind = $main, mouse_up, workspace, e-1

# Screenshot a window
bind = $main, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region

# Move/resize windows with main + LMB/RMB and dragging
bindm = $main, mouse:272, movewindow
bindm = $main, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, pw-volume change +5%; pkill -RTMIN+8 waybar
bindel = ,XF86AudioLowerVolume, exec, pw-volume change -5%; pkill -RTMIN+8 waybar
bindel = $main shift, bracketright, exec, pw-volume change +5%; pkill -RTMIN+8 waybar
bindel = $main shift, bracketleft, exec, pw-volume change -5%; pkill -RTMIN+8 waybar
bindel = ,XF86AudioMute, exec, pw-volume mute toggle; pkill -RTMIN+8 waybar
bindel = ,XF86AudioMicMute, exec, pw-volume mute toggle; pkill -RTMIN+8 waybar

bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel = $main, bracketright, exec, brightnessctl s 10%+
bindel = $main, bracketleft, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $main, n, exec, neovide

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, title:图片查看器
windowrulev2 = float, title:预览
windowrulev2 = float, title:好友列表
windowrulev2 = float, class:^(.*polkit-kde.*)$

windowrulev2 = noanim, class:^(flameshot)$
windowrulev2 = float, class:^(flameshot)$
windowrulev2 = move 0 0, class:^(flameshot)$
windowrulev2 = pin, class:^(flameshot)$

# Open File
windowrulev2 = noborder, title:Open Files
windowrulev2 = noblur, title:Open Files
windowrulev2 = noshadow, title:Open Files
windowrulev2 = norounding, title:Open Files

windowrulev2 = float, title:Bluetooth Devices
