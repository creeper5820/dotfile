###################
### KEYBINDINGS ###
###################

$terminal       = kitty
$fileManager    = nautilus
$menu           = LANG="C" rofi -show drun
$setting        = systemsettings

# See https://wiki.hyprland.org/Configuring/Keywords/
$main = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $main, return, exec, $terminal
bind = $main, E, exec, $fileManager
bind = $main, D, exec, dms ipc call spotlight toggle
bind = $main, P, exec, $setting
bind = $main, q, exec, hyprctl --batch "dispatch killactive"
bind = $main shift, q, exit,
bind = $main, R, pseudo
bind = $main, F, togglefloating
bind = $main shift, F, fullscreen

bind = $main, tab, focusmonitor, +1
bind = $main SHIFT, tab, focusmonitor, -1

# Move focus with main + arrow keys
bind = $main, left, movefocus, l
bind = $main, right, movefocus, r
bind = $main, up, movefocus, u
bind = $main, down, movefocus, d

# Switch workspaces with main + [0-9]
bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9
bind = $main, 0, workspace, 10

# Move active window to a workspace with main + SHIFT + [0-9]
bind = $main SHIFT, 1, movetoworkspace, 1
bind = $main SHIFT, 2, movetoworkspace, 2
bind = $main SHIFT, 3, movetoworkspace, 3
bind = $main SHIFT, 4, movetoworkspace, 4
bind = $main SHIFT, 5, movetoworkspace, 5
bind = $main SHIFT, 6, movetoworkspace, 6
bind = $main SHIFT, 7, movetoworkspace, 7
bind = $main SHIFT, 8, movetoworkspace, 8
bind = $main SHIFT, 9, movetoworkspace, 9
bind = $main SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $main, S, togglespecialworkspace, magic
bind = $main SHIFT, S, movetoworkspace, special:magic

# Scroll through columns in scroll layout with main + scroll
bind = $main, mouse_down, layoutmsg, move +col
bind = $main, mouse_up, layoutmsg, move -col

# Move/resize windows with main + LMB/RMB and dragging
bindm = $main, mouse:272, movewindow
bindm = $main, mouse:273, resizewindow

# Move window
bind = $main SHIFT, H, movewindow, l
bind = $main SHIFT, L, movewindow, r
bind = $main SHIFT, K, movewindow, u
bind = $main SHIFT, J, movewindow, d

# Scroll layout
bind = $main, period, layoutmsg, move +col
bind = $main, k, layoutmsg, move +col
bind = $main, comma, layoutmsg, move -col
bind = $main, j, layoutmsg, move -col
bind = $main SHIFT, period, layoutmsg, swapcol r
bind = $main SHIFT, k, layoutmsg, swapcol r
bind = $main SHIFT, comma, layoutmsg, swapcol l
bind = $main SHIFT, j, layoutmsg, swapcol l

bind = $main, H, layoutmsg, colresize +conf

# Laptop multimedia keys for volume and LCD brightness
binde = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%; pkill -RTMIN+8 waybar
binde = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%; pkill -RTMIN+8 waybar
binde = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle; pkill -RTMIN+8 waybar

binde = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

binde = $main shift, bracketright, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%; pkill -RTMIN+8 waybar
binde = $main shift, bracketleft, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%; pkill -RTMIN+8 waybar

binde = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
binde = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
binde = $main, bracketright, exec, brightnessctl s 10%+
binde = $main, bracketleft, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshot
bind = $main Ctrl, R, exec, hyprshot -m region
bind = $main Ctrl, W, exec, hyprshot -m window
bind = $main Ctrl, O, exec, hyprshot -m output

# Neovide
bind = $main, n, exec, "neovide"
